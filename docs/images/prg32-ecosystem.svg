<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Helvetica, Arial, sans-serif">
  <title>The PRG32 ecosystem: repositories and the protocols that join them</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <style>
      .box { stroke-width: 2; rx: 10; }
      .title { font-size: 17px; font-weight: bold; fill: #102027; }
      .text { font-size: 13px; fill: #263238; }
      .small { font-size: 12px; fill: #455a64; font-style: italic; }
      .link { stroke: #37474f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .label { font-size: 12px; fill: #37474f; }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- People -->
  <rect class="box" x="30" y="30" width="220" height="70" fill="#fff8e1" stroke="#f9a825"/>
  <text class="title" x="140" y="60" text-anchor="middle">Students and teachers</text>
  <text class="text" x="140" y="82" text-anchor="middle">browser, VS Code, terminal</text>

  <!-- Construction Kit -->
  <rect class="box" x="30" y="170" width="260" height="110" fill="#e3f2fd" stroke="#1565c0"/>
  <text class="title" x="160" y="198" text-anchor="middle">PRG32-Construction-Kit</text>
  <text class="text" x="160" y="220" text-anchor="middle">Blocks, C, assembly, PRG32 Python</text>
  <text class="text" x="160" y="238" text-anchor="middle">compiler, simulator, classes</text>
  <text class="small" x="160" y="262" text-anchor="middle">kit.prg32.uniparthenope.it</text>

  <!-- PRG32 SDK and firmware -->
  <rect class="box" x="350" y="170" width="260" height="110" fill="#e8f5e9" stroke="#2e7d32"/>
  <text class="title" x="480" y="198" text-anchor="middle">PRG32 (this repository)</text>
  <text class="text" x="480" y="220" text-anchor="middle">firmware, ABI, SDK command line</text>
  <text class="text" x="480" y="238" text-anchor="middle">cartridges, examples, docs</text>
  <text class="small" x="480" y="262" text-anchor="middle">github.com/riscv-prg32/PRG32</text>

  <!-- Cartridge Store -->
  <rect class="box" x="670" y="170" width="260" height="110" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text class="title" x="800" y="198" text-anchor="middle">CartridgeStore</text>
  <text class="text" x="800" y="220" text-anchor="middle">catalog, downloads, scores</text>
  <text class="text" x="800" y="238" text-anchor="middle">metrics, multiplayer relay</text>
  <text class="small" x="800" y="262" text-anchor="middle">store.prg32.uniparthenope.it</text>

  <!-- Hardware and hosts -->
  <rect class="box" x="200" y="400" width="250" height="110" fill="#fbe9e7" stroke="#d84315"/>
  <text class="title" x="325" y="428" text-anchor="middle">Consoles</text>
  <text class="text" x="325" y="450" text-anchor="middle">ESP32-C6 board (RV32IMAC)</text>
  <text class="text" x="325" y="468" text-anchor="middle">QEMU ESP32-C3 virtual screen</text>
  <text class="small" x="325" y="492" text-anchor="middle">resident PRG32 firmware</text>

  <rect class="box" x="30" y="400" width="140" height="110" fill="#eceff1" stroke="#546e7a"/>
  <text class="title" x="100" y="428" text-anchor="middle">PRG32-QT</text>
  <text class="text" x="100" y="450" text-anchor="middle">desktop, mobile</text>
  <text class="text" x="100" y="468" text-anchor="middle">and TV host</text>
  <text class="small" x="100" y="492" text-anchor="middle">Store browser</text>

  <!-- Multiplayer Server -->
  <rect class="box" x="560" y="400" width="260" height="110" fill="#e0f7fa" stroke="#00838f"/>
  <text class="title" x="690" y="428" text-anchor="middle">PRG32-Multiplayer-Server</text>
  <text class="text" x="690" y="450" text-anchor="middle">Node.js WebSocket relay</text>
  <text class="text" x="690" y="468" text-anchor="middle">rooms by cartridge signature</text>
  <text class="small" x="690" y="492" text-anchor="middle">LAN discovery or Store relay</text>

  <!-- Links -->
  <path class="link" d="M140,100 L140,168"/>
  <text class="label" x="148" y="140">write and build games</text>

  <path class="link" d="M290,225 L348,225"/>
  <text class="label" x="298" y="215">SDK</text>

  <path class="link" d="M610,225 L668,225"/>
  <text class="label" x="614" y="215">publish</text>

  <path class="link" d="M160,280 L290,398"/>
  <text class="label" x="118" y="350">Web Serial</text>
  <text class="label" x="118" y="365">prg32-io-1.0</text>

  <path class="link" d="M440,280 L360,398"/>
  <text class="label" x="408" y="350">USB / QEMU socket</text>
  <text class="label" x="408" y="365">prg32-io-1.0</text>

  <path class="link" d="M760,280 L430,398"/>
  <text class="label" x="640" y="330">HTTP + mDNS: download,</text>
  <text class="label" x="640" y="345">scores, metrics</text>

  <path class="link" d="M452,470 L558,470"/>
  <text class="label" x="462" y="460">WebSocket</text>
  <text class="label" x="455" y="488" style="font-size:10px">prg32-multiplayer-1.0</text>

</svg>
