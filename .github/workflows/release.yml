name: Firmware release

# Pushing a tag such as v1.8.0 builds the ESP32-C6 firmware for every pin
# profile and publishes a GitHub release with prg32-firmware.json, the flash
# parts, and SHA256SUMS. A manual run (workflow_dispatch) builds the same files
# as a workflow artifact without publishing a release.
# Format: docs/usage/firmware_releases.md

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  ESP_IDF_VERSION: v5.4.1

jobs:
  build:
    name: Build ${{ matrix.profile }}
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.1
    strategy:
      fail-fast: true
      matrix:
        profile: [breadboard1, breadboard2, pcb1]

    steps:
      - name: Check out repository with tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build ESP32-C6 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-release \
            -D SDKCONFIG=build-release/sdkconfig \
            -D "SDKCONFIG_DEFAULTS=profiles/sdkconfig.defaults;profiles/sdkconfig.defaults.esp32c6;profiles/sdkconfig.pins.${{ matrix.profile }}" \
            set-target esp32c6 build

      - name: Show tracked files the build changed
        shell: bash
        run: git status --short --untracked-files=no

      - name: Package flash parts
        shell: bash
        run: |
          expected=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then expected="${GITHUB_REF_NAME}"; fi
          python3 tools/prg32_firmware_release.py package \
            --build-dir build-release \
            --profile "${{ matrix.profile }}" \
            --version "$expected" \
            --out-dir release-assets

      - name: Upload profile parts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.profile }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Manifest and release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Collect profile parts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: release-assets
          merge-multiple: true

      - name: Write prg32-firmware.json and SHA256SUMS
        run: |
          cp tools/prg32_flash_release.py release-assets/
          python3 tools/prg32_firmware_release.py manifest \
            --out-dir release-assets \
            --commit "${GITHUB_SHA}" \
            --esp-idf "${ESP_IDF_VERSION}"
          cat release-assets/prg32-firmware.json
          ls -l release-assets

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: prg32-firmware-release
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "PRG32 firmware ${GITHUB_REF_NAME}" \
            --notes "Resident PRG32 firmware ${GITHUB_REF_NAME} for the ESP32-C6, built by GitHub Actions with ESP-IDF ${ESP_IDF_VERSION} from ${GITHUB_SHA}.

          Pin profiles: breadboard1, breadboard2, pcb1. Each profile has three flash parts (bootloader, partition table, application); Wi-Fi settings, cartridges, and scores on the board are kept.

          Flash it without ESP-IDF or the PRG32 SDK:

              python3 prg32_flash_release.py --release ${GITHUB_REF_NAME}

          (tools/prg32_flash_release.py in this repository). Format and checksums: docs/usage/firmware_releases.md, SHA256SUMS."
