name: CI and cartridge packages

on:
  push:
    branches:
      - main
      - development-c6
  pull_request:
  workflow_dispatch:

jobs:
  host-smoke:
    name: Host smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install host test dependencies
        run: python3 -m pip install pytest

      - name: Run host smoke test
        run: python3 -m prg32.esp32c6.ci_smoke_test

      - name: Check portable ABI generated files
        run: python3 -m prg32 abi check

  esp-idf-build:
    name: ESP-IDF firmware build
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure Git workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build ESP32-C6 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32c6
          idf.py build

  cartridge-build:
    name: Cartridge checks and packages
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure Git workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check Blackjack rules
        shell: bash
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            cartridges/blackjack/tests/test_rules.c \
            cartridges/blackjack/blackjack_rules.c \
            -o /tmp/prg32-blackjack-rules
          /tmp/prg32-blackjack-rules
          sha256sum --check cartridges/blackjack/SHA256SUMS

      - name: Check DeviceDemo sources and metadata
        run: cartridges/devicedemo/tests/check_source.sh

      - name: Check Bach Stereo Showcase
        run: cartridges/bachdemo/scripts/test.sh

      - name: Check Poing renderer
        run: cartridges/poing/tests/run.sh

      - name: Check PRG32 C interpreter
        run: |
          cartridges/c-language/tests/check_source.sh
          cartridges/c-language/tests/run_host_tests.sh

      - name: Build portable graphics assembly examples
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          for game in pong tetris; do
            python3 -m prg32 cartridge build "examples/games/$game/graphics/game.S" \
              --portable --entry-prefix "${game}_graphics" --name "$game" \
              --out "/tmp/prg32-${game}-graphics.prg32"
          done

      - name: Validate cartridge screenshots and audiovisual previews
        run: |
          python3 tools/validate_cartridge_media.py cartridges/bachdemo/assets/screenshot.png cartridges/bachdemo/assets/preview.mp4
          python3 tools/validate_cartridge_media.py cartridges/blackjack/screenshot.png cartridges/blackjack/preview.mp4
          python3 tools/validate_cartridge_media.py cartridges/devicedemo/assets/screenshot.png cartridges/devicedemo/assets/preview.mp4
          python3 tools/validate_cartridge_media.py cartridges/poing/assets/screenshot.png cartridges/poing/assets/preview.mp4

      - name: Build Blackjack store bundle
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cartridges/blackjack/build.sh

      - name: Build DeviceDemo store bundle
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          PRG32_REPO="$GITHUB_WORKSPACE" PRG32_ARCHITECTURE=esp32c6 \
            cartridges/devicedemo/scripts/build.sh
          PRG32_REPO="$GITHUB_WORKSPACE" PRG32_ARCHITECTURE=qemu \
            cartridges/devicedemo/scripts/build.sh
          PRG32_REPO="$GITHUB_WORKSPACE" \
            cartridges/devicedemo/scripts/pack-store-bundle.sh

      - name: Build Bach Stereo Showcase packages
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          PRG32_REPO="$GITHUB_WORKSPACE" cartridges/bachdemo/scripts/build.sh esp32c6
          PRG32_REPO="$GITHUB_WORKSPACE" cartridges/bachdemo/scripts/build.sh qemu

      - name: Build Poing packages
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          PRG32_REPO="$GITHUB_WORKSPACE" cartridges/poing/build.sh "$GITHUB_WORKSPACE" esp32c6
          PRG32_REPO="$GITHUB_WORKSPACE" cartridges/poing/build.sh "$GITHUB_WORKSPACE" qemu

      - name: Build Audio Pan Test and Performance Test packages
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          for arch in esp32c6 qemu; do
            python3 -m prg32 cartridge build cartridges/audiotest/src/audiotest.c \
              --portable --entry-prefix audiotest --name AudioTest \
              --architecture "$arch" --out "cartridges/audiotest/audiotest-$arch.prg32"
            PRG32_REPO="$GITHUB_WORKSPACE" PRG32_ARCHITECTURE="$arch" \
              cartridges/performancetest/scripts/build.sh
            PRG32_REPO="$GITHUB_WORKSPACE" PRG32_ARCHITECTURE="$arch" \
              cartridges/c-language/scripts/build.sh
          done

      - name: Validate cartridge packages
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python3 -m prg32 cartridge summary \
            cartridges/blackjack/dist/store/blackjack-esp32c6.prg32
          python3 -m prg32 store inspect-metadata \
            cartridges/blackjack/dist/store/blackjack-esp32c6.prg32
          python3 -m prg32 cartridge summary \
            cartridges/devicedemo/dist/devicedemo-esp32c6.prg32
          python3 -m prg32 store inspect-metadata \
            cartridges/devicedemo/dist/devicedemo-esp32c6.prg32
          python3 -m zipfile -t cartridges/blackjack/dist/blackjack-1.0.0-store.zip
          python3 -m zipfile -t cartridges/devicedemo/dist/devicedemo-store-bundle.zip
          python3 -m prg32 cartridge summary \
            cartridges/bachdemo/dist/bach-stereo-showcase-esp32c6.prg32
          python3 -m prg32 store inspect-metadata \
            cartridges/bachdemo/dist/bach-stereo-showcase-esp32c6.prg32
          python3 -m prg32 cartridge summary \
            cartridges/poing/dist/poing-esp32c6.prg32
          python3 -m prg32 store inspect-metadata \
            cartridges/poing/dist/poing-esp32c6.prg32
          python3 -m prg32 cartridge summary cartridges/audiotest/audiotest-esp32c6.prg32
          python3 -m prg32 cartridge summary cartridges/audiotest/audiotest-qemu.prg32
          for arch in esp32c6 qemu; do
            python3 -m prg32 cartridge summary "cartridges/performancetest/dist/performancetest-$arch.prg32"
            python3 -m prg32 store inspect-metadata "cartridges/performancetest/dist/performancetest-$arch.prg32"
            python3 -m prg32 cartridge summary "cartridges/c-language/dist/c-language-$arch.prg32"
            python3 -m prg32 store inspect-metadata "cartridges/c-language/dist/c-language-$arch.prg32"
          done

      - name: Upload Blackjack package
        uses: actions/upload-artifact@v4
        with:
          name: blackjack-cartridge-package
          path: |
            cartridges/blackjack/dist/blackjack-1.0.0-store.zip
            cartridges/blackjack/dist/store/blackjack-esp32c6.prg32
            cartridges/blackjack/dist/store/blackjack-qemu.prg32
            cartridges/blackjack/screenshot.png
            cartridges/blackjack/preview.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Upload DeviceDemo package
        uses: actions/upload-artifact@v4
        with:
          name: devicedemo-cartridge-package
          path: |
            cartridges/devicedemo/dist/devicedemo-store-bundle.zip
            cartridges/devicedemo/dist/devicedemo-esp32c6.prg32
            cartridges/devicedemo/dist/devicedemo-qemu.prg32
            cartridges/devicedemo/assets/screenshot.png
            cartridges/devicedemo/assets/preview.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Upload Bach Stereo Showcase package
        uses: actions/upload-artifact@v4
        with:
          name: bachdemo-cartridge-package
          path: |
            cartridges/bachdemo/dist/bach-stereo-showcase-esp32c6.prg32
            cartridges/bachdemo/dist/bach-stereo-showcase-qemu.prg32
            cartridges/bachdemo/assets/screenshot.png
            cartridges/bachdemo/assets/preview.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Upload Poing package
        uses: actions/upload-artifact@v4
        with:
          name: poing-cartridge-package
          path: |
            cartridges/poing/dist/poing-esp32c6.prg32
            cartridges/poing/dist/poing-qemu.prg32
            cartridges/poing/assets/screenshot.png
            cartridges/poing/assets/preview.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Upload Audio Pan Test packages
        uses: actions/upload-artifact@v4
        with:
          name: audiotest-cartridge-package
          path: cartridges/audiotest/audiotest-*.prg32
          if-no-files-found: error
          retention-days: 14

      - name: Upload Performance Test packages
        uses: actions/upload-artifact@v4
        with:
          name: performancetest-cartridge-package
          path: cartridges/performancetest/dist/performancetest-*.prg32
          if-no-files-found: error
          retention-days: 14

      - name: Upload PRG32 C packages
        uses: actions/upload-artifact@v4
        with:
          name: c-language-cartridge-package
          path: |
            cartridges/c-language/dist/c-language-esp32c6.prg32
            cartridges/c-language/dist/c-language-qemu.prg32
          if-no-files-found: error
          retention-days: 14
